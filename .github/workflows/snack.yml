name: Snake Contrib

on:
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-snake-contrib/github-contribution-grid-snake.svg
            profile-snake-contrib/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit generated snake assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- profile-snake-contrib/github-contribution-grid-snake.svg profile-snake-contrib/github-contribution-grid-snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(profile): update snake contribution assets"
            git push origin HEAD:main
          fi
