<title id="hero-title">OmniForge · From intent to evidence</title>
<desc id="hero-desc">Warm ivory and brass text on graphite. The original anvil and rainbow fish mark, orchestration nodes, abstract engineering geometry and execution records form the cover. All graphics are system illustrations, not project results.</desc>
