name: GitHub Metrics

on:
  schedule:
    - cron: '17 0 * * *' # 08:17 Asia/Shanghai; schedules can be delayed by GitHub.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-generated-assets
  cancel-in-progress: false

jobs:
  public-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Refresh public metrics and optional WakaTime aggregate
        run: python3 scripts/update_activity.py --kind metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      - name: Validate generated SVGs and freshness metadata
        run: python3 scripts/validate_activity.py
      - name: Commit only owned generated assets
        run: python3 scripts/commit_activity.py --kind metrics
